services:
  - type: web
    name: skku-notice-calendar
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: SCRAPE_INTERVAL
        value: "24"
    plan: free

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SKKU 공지사항 캘린더</title>
  
  <!-- 파비콘 -->
  <link rel="icon" type="image/svg+xml" href="/static/logo.png">

  <!-- FullCalendar v6 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

  <!-- ── 헤더 ─────────────────────────────────────────── -->
  <header class="header">
    <div class="header-inner">
      <div class="header-left">
        <h1 class="logo">
          <span class="logo-icon">📅</span>
          SKKU 공지사항 캘린더
        </h1>      </div>
      <div class="header-right">
        <!-- 버튼 제거 -->
      </div>
    </div>
  </header>

  <!-- ── 메인 컨텐츠 ─────────────────────────────────── -->
  <main class="main">
    <!-- 필터 바 -->
    <div class="filter-bar">
      <div class="filter-group">
        <span class="filter-label">카테고리 필터:</span>
        <button class="filter-chip active" data-source="all">전체</button>
        {% for source in sources %}
        <button class="filter-chip" data-source="{{ source.id }}"
                style="--chip-color: {{ source.color }}">
          <span class="chip-dot" style="background: {{ source.color }}"></span>
          {{ source.short_name }}
        </button>
        {% endfor %}
      </div>
    </div>

    <!-- 캘린더 -->
    <div class="calendar-container">
      <div id="calendar"></div>
    </div>

    <!-- 다가오는 마감일 -->
    <div class="upcoming-section">
      <h2 class="section-title">🔥 다가오는 마감일</h2>
      <div id="upcoming-list" class="upcoming-list">
        <p class="placeholder">로딩 중...</p>
      </div>
    </div>
  </main>

  <!-- ── 이벤트 상세 모달 ─────────────────────────────── -->
  <div id="event-modal" class="modal-overlay" style="display: none;">
    <div class="modal">
      <button class="modal-close" id="modal-close">&times;</button>
      <div class="modal-badge" id="modal-source"></div>
      <h3 class="modal-title" id="modal-title"></h3>
      <div class="modal-meta">
        <div class="meta-item">
          <span class="meta-label">📂 카테고리</span>
          <span class="meta-value" id="modal-category"></span>
        </div>
        <div class="meta-item">
          <span class="meta-label">📅 마감일</span>
          <span class="meta-value" id="modal-deadline"></span>
        </div>
        <div class="meta-item">
          <span class="meta-label">📝 게시일</span>
          <span class="meta-value" id="modal-posted"></span>
        </div>
      </div>
      <a id="modal-link" href="#" target="_blank" class="btn btn-primary modal-btn">
        원문 보기 →
      </a>
    </div>
  </div>

  <!-- ── 토스트 알림 ──────────────────────────────────── -->
  <div id="toast" class="toast" style="display: none;"></div>

  <script src="/static/js/app.js"></script>
</body>
</html>
